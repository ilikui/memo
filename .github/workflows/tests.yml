name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test Python
        run: pytest -q
      - name: Check PWA JavaScript syntax
        run: |
          node --input-type=module --check < web/app.js
          node --check web/sw.js
