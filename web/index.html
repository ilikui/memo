<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#20242c"><link rel="manifest" href="/web/manifest.webmanifest">
<title>VibeReading</title>
<style>
body{font:16px/1.6 system-ui,sans-serif;max-width:760px;margin:3rem auto;padding:0 1rem;color:#20242c}
.card{border:1px solid #ddd;border-radius:16px;padding:1.25rem;margin:1rem 0}
button{padding:.7rem 1rem;border:0;border-radius:9px;margin:.25rem;cursor:pointer}
input,textarea{box-sizing:border-box;width:100%;padding:.75rem;margin:.35rem 0}
</style></head>
<body>
<h1>VibeReading</h1><p>Progressive reading · Luhmann notes · FSRS reviews</p><p id="status">Starting…</p>
<section class="card"><h2>Create a flashcard (online in this MVP)</h2>
<input id="front" placeholder="Front: question or prompt"><textarea id="back" placeholder="Back: answer or explanation"></textarea>
<button id="create">Save card</button><button id="refresh">Refresh</button></section>
<section class="card"><h2>Flashcards</h2><div id="cards">Loading…</div></section>
<script type="module" src="/web/app.js"></script>
</body></html>
