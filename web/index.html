<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#20242c"><link rel="manifest" href="/web/manifest.webmanifest">
<title>VibeReading</title>
<style>
:root{color-scheme:light dark}
body{font:16px/1.6 system-ui,sans-serif;max-width:900px;margin:2rem auto;padding:0 1rem;color:CanvasText;background:Canvas}
.card{border:1px solid #8885;border-radius:16px;padding:1.25rem;margin:1rem 0}
button{padding:.65rem .9rem;border:1px solid #8885;border-radius:9px;margin:.25rem;cursor:pointer}
input,textarea,select{box-sizing:border-box;width:100%;padding:.75rem;margin:.35rem 0;border:1px solid #8887;border-radius:8px;background:Canvas;color:CanvasText}
textarea{min-height:180px;font:inherit}
.note-row{border-top:1px solid #8884;padding:.65rem 0}
.note-row p{margin:.25rem 0;white-space:pre-wrap;overflow-wrap:anywhere}
.muted{opacity:.72;font-size:.9rem}
.answer{white-space:pre-wrap;overflow-wrap:anywhere}
</style></head>
<body>
<h1>VibeReading</h1><p>渐进阅读 · 卢曼卡片 · FSRS 间隔复习</p><p id="status">Starting…</p>
<section class="card" id="syncQueuePanel" aria-live="polite">
  <h2>同步队列</h2>
  <p id="syncQueueSummary" class="muted">正在检查本地待同步操作…</p>
  <div id="syncQueueItems"></div>
  <button id="retrySyncQueue">重试可同步操作</button>
</section>
<section class="card">
<h2>Markdown 笔记</h2>
<button id="showGraph">知识图谱 / 孤立卡片</button>
<div id="graphPanel" aria-live="polite"></div>
<input id="noteSearch" placeholder="搜索标题或正文" aria-label="搜索笔记">
<div class="muted">点击列表中的笔记可继续编辑；当前编辑器保存 Markdown 源文本。</div>
<div id="noteList">Loading notes…</div>
<hr>
<input id="noteTitle" placeholder="笔记标题">
<select id="noteType" aria-label="笔记类型">
<option value="fleeting">闪念笔记</option><option value="literature">文献笔记</option>
<option value="permanent" selected>永久笔记</option><option value="index">索引笔记</option>
</select>
<textarea id="noteBody" placeholder="在这里写 Markdown 内容…"></textarea>
<p id="noteEditing" class="muted">新建笔记</p>
<button id="saveNote">保存笔记</button><button id="newNote">新建 / 清空</button>
<div id="noteLinks" class="muted" aria-live="polite"></div>
</section>

<section class="card" id="readingWorkspace">
<h2>渐进阅读</h2>
<p class="muted">保存文章链接并粘贴正文 Markdown；可记录阅读进度、摘录重点和写下自己的思考。当前不自动抓取网页。</p>
<div id="readingList">加载阅读清单中…</div>
<hr>
<h3>添加阅读材料</h3>
<input id="readingTitle" placeholder="文章标题">
<input id="readingUrl" placeholder="原文链接（可选，http/https）">
<textarea id="readingContent" placeholder="粘贴文章正文或 Markdown 内容…"></textarea>
<button id="createDocument">加入阅读清单</button>
<div id="readingEditor" hidden>
<hr>
<h3 id="readingCurrentTitle">正在阅读</h3>
<p id="readingSource" class="muted"></p>
<input id="readingEditTitle" placeholder="文章标题">
<input id="readingEditUrl" placeholder="原文链接（可选）">
<label for="readingStatus">阅读状态</label>
<select id="readingStatus"><option value="unread">未开始</option><option value="reading">阅读中</option><option value="completed">已完成</option></select>
<label for="readingProgress">阅读进度：<span id="readingProgressLabel">0%</span></label>
<input id="readingProgress" type="range" min="0" max="100" value="0">
<textarea id="readingBody" placeholder="文章正文 Markdown…"></textarea>
<button id="saveReadingDocument">保存正文</button><button id="saveReadingProgress">保存进度</button>
<h4>重点摘录</h4>
<p class="muted">在正文框中选中一段文字，再点“摘录选中文本”，也可以手动输入摘录。</p>
<textarea id="highlightQuote" placeholder="摘录原文（可从正文选中后自动填入）"></textarea>
<textarea id="highlightNote" placeholder="我的思考 / 批注（可选）"></textarea>
<button id="captureSelection">摘录选中文本</button><button id="saveHighlight">保存摘录</button>
<div id="highlightList"></div>
</div>
</section>

<section class="card"><h2>创建闪卡</h2>
<input id="front" placeholder="正面：问题或提示"><textarea id="back" placeholder="背面：答案或解释"></textarea>
<button id="create">保存闪卡</button><button id="refresh">刷新闪卡</button></section>
<section class="card"><h2>闪卡复习</h2><div id="cards">Loading…</div></section>
<script type="module" src="/web/app.js"></script>
</body></html>
