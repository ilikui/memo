<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#20242c"><link rel="manifest" href="/web/manifest.webmanifest">
<title>VibeReading</title>
<style>
:root{color-scheme:light dark}
body{font:16px/1.6 system-ui,sans-serif;max-width:900px;margin:2rem auto;padding:0 1rem;color:CanvasText;background:Canvas}
.card{border:1px solid #8885;border-radius:16px;padding:1.25rem;margin:1rem 0}
button{padding:.65rem .9rem;border:1px solid #8885;border-radius:9px;margin:.25rem;cursor:pointer}
input,textarea,select{box-sizing:border-box;width:100%;padding:.75rem;margin:.35rem 0;border:1px solid #8887;border-radius:8px;background:Canvas;color:CanvasText}
textarea{min-height:180px;font:inherit}
.note-row{border-top:1px solid #8884;padding:.65rem 0}
.note-row p{margin:.25rem 0;white-space:pre-wrap;overflow-wrap:anywhere}
.muted{opacity:.72;font-size:.9rem}
.answer{white-space:pre-wrap;overflow-wrap:anywhere}
</style></head>
<body>
<h1>VibeReading</h1><p>渐进阅读 · 卢曼卡片 · FSRS 间隔复习</p><p id="status">Starting…</p>
<section class="card">
<h2>Markdown 笔记</h2>
<input id="noteSearch" placeholder="搜索标题或正文" aria-label="搜索笔记">
<div class="muted">点击列表中的笔记可继续编辑；当前编辑器保存 Markdown 源文本。</div>
<div id="noteList">Loading notes…</div>
<hr>
<input id="noteTitle" placeholder="笔记标题">
<select id="noteType" aria-label="笔记类型">
<option value="fleeting">闪念笔记</option><option value="literature">文献笔记</option>
<option value="permanent" selected>永久笔记</option><option value="index">索引笔记</option>
</select>
<textarea id="noteBody" placeholder="在这里写 Markdown 内容…"></textarea>
<p id="noteEditing" class="muted">新建笔记</p>
<button id="saveNote">保存笔记</button><button id="newNote">新建 / 清空</button>
</section>
<section class="card"><h2>创建闪卡</h2>
<input id="front" placeholder="正面：问题或提示"><textarea id="back" placeholder="背面：答案或解释"></textarea>
<button id="create">保存闪卡</button><button id="refresh">刷新闪卡</button></section>
<section class="card"><h2>闪卡复习</h2><div id="cards">Loading…</div></section>
<script type="module" src="/web/app.js"></script>
</body></html>
